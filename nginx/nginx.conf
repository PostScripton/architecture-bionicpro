# Nginx как reverse proxy перед Minio (S3), эмулирует CDN, раздающий
# сформированные отчёты reports-api.
#
# Структура хранения в S3 - <username>/<report_date>.json (см.
# reports-api/main.py). Отчёт за дату иммутабелен: Airflow формирует
# витрину и, соответственно, объект в S3 только один раз за сутки, поэтому
# кеш можно держать долго и не инвалидировать по времени - для новой даты
# у объекта будет новый URL, а старые URL всегда отдают тот же контент.

proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name cdn.bionicpro.local;

    location /reports/ {
        proxy_pass http://minio:9000/reports/;
        proxy_set_header Host minio:9000;

        proxy_cache reports_cache;
        proxy_cache_key $uri;
        # 200 - готовый отчёт, кешируем надолго, т.к. объект по этому
        # ключу не изменяется. 404 кешируем на короткое время, чтобы не
        # долбить Minio, пока reports-api ещё не успел положить объект.
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
